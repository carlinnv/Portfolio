name: CI

# Checks every pull request (including Dependabot's) before it can be merged.
# Same steps as the deploy workflow, but it never deploys.
on:
  pull_request:
    branches: [main]

# Read-only: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same pull request cancels the older check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
