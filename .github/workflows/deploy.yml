name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, publish to Pages, and prove identity to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the GitHub token on disk for later steps.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          # No dependency cache: avoids cache-poisoning risk in a publishing
          # workflow. Installs take only a few seconds without it.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
